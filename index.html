<title>بنيان مرصوص</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9eff4;--surface:#ffffff;--ink:#13253b;--ink2:#48596e;--ink3:#8494a8;--line:#d2dbe4;
  --acc:#1f4e8c;--gold:#c8952a;--ok:#1f8f72;--warn:#d98a1b;--bad:#c2433a;
  --sky:#d8e6f1;--wall:#efe9dc;--wall2:#dbd1bc;--trim:#b8ac93;--void:#1c3450;--ground:#c6d7cc;
  --crack:#6b5d4d;--trunk:#7a5a3a;--leaf:#3f8f5f;
  --t0:#2b5fa8;--t1:#1f8a63;--t2:#c27a12;--t3:#8a3f78;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1a2a;--surface:#152538;--ink:#e6edf5;--ink2:#a8b6c7;--ink3:#71829a;--line:#26384e;
    --acc:#6ea2e6;--sky:#1b3049;--wall:#d9d2c2;--wall2:#b5ac98;--trim:#8f8672;--void:#0f1f33;--ground:#20372f;--crack:#4d4438;
    --t0:#5b8fd6;--t1:#3fb58b;--t2:#e0982e;--t3:#c070ab;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1a2a;--surface:#152538;--ink:#e6edf5;--ink2:#a8b6c7;--ink3:#71829a;--line:#26384e;
  --acc:#6ea2e6;--sky:#1b3049;--wall:#d9d2c2;--wall2:#b5ac98;--trim:#8f8672;--void:#0f1f33;--ground:#20372f;--crack:#4d4438;
  --t0:#5b8fd6;--t1:#3fb58b;--t2:#e0982e;--t3:#c070ab;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:'Aref Ruqaa','Amiri','Traditional Arabic',serif;font-weight:700;margin:0;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:6px}
main{max-width:980px;margin:0 auto;padding:16px 16px 100px}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;min-height:44px;font-weight:500}
.tabs button[aria-current="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
:root[data-theme="dark"] .tabs button[aria-current="true"]{color:#0e1a2a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs button[aria-current="true"]{color:#0e1a2a}}

/* hero */
.hero{padding:8px 0 18px}
.hero h1{font-size:clamp(2.6rem,11vw,4.4rem);color:var(--acc)}
.lead{margin:6px 0 16px;color:var(--ink2);max-width:34em}
.wk-now{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.wk-now .big{font-family:'Aref Ruqaa',serif;font-size:3.2rem;font-weight:700;line-height:1;margin-inline-end:8px}
.wk-now .of{color:var(--ink2)}
.wk-now p{margin:0;font-size:1.05rem}
.track{display:grid;grid-template-columns:repeat(15,1fr);gap:3px;margin:12px 0 18px}
.track i{height:10px;border-radius:2px;background:var(--line)}
.track i.d{background:var(--acc)}
.track i.c{background:var(--gold)}
.rules{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0}
.rules div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.rules dt{font-weight:600}
.rules dd{margin:0;color:var(--ink2);font-size:.92rem}
.rules b{color:var(--acc)}
.note{color:var(--ink2);font-size:.92rem;margin:10px 0 0}

/* team cards */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));margin-top:6px}
.team{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 14px 16px;border-top:5px solid var(--tc)}
.team header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.team h3{font-size:1.6rem}
.team .rank{color:var(--ink2);font-size:.85rem}
.pctline{display:flex;align-items:baseline;gap:8px;margin:2px 0 8px}
.pctline b{font-size:2rem;color:var(--tc);font-weight:600}
.pctline span{color:var(--ink2);font-size:.9rem}
.mosque{display:block;width:100%;height:auto;border-radius:10px}
.strip{display:grid;grid-template-columns:repeat(15,1fr);gap:3px;margin:10px 0 12px}
.strip i{height:18px;border-radius:3px;background:linear-gradient(to top,var(--tc) calc(var(--f)*100%),var(--line) 0)}
.strip i.cur{outline:2px solid var(--gold);outline-offset:1px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0}
.facts div{background:var(--bg);border-radius:10px;padding:8px 6px;text-align:center}
.facts dt{font-size:.78rem;color:var(--ink2)}
.facts dd{margin:0;font-weight:600;font-size:1.05rem}

/* svg parts */
.sky{fill:var(--sky)} .grd{fill:var(--ground)}
.mosque .wall{fill:var(--wall);stroke:var(--trim);stroke-width:.7}
.mosque .wall2{fill:var(--wall2);stroke:var(--trim);stroke-width:.7}
.mosque .trim{fill:var(--trim)}
.mosque .void{fill:var(--void)}
.mosque .dome{fill:var(--tc)}
.mosque .gold{fill:var(--gold)}
.mosque .goldl{fill:none;stroke:var(--gold);stroke-width:1.6}
.mosque .dash{stroke-dasharray:2 3}
.mosque .trunk{fill:var(--trunk)}
.mosque .leaf{fill:var(--leaf)}
.mosque .crack{fill:none;stroke:var(--crack);stroke-width:1.1;stroke-linejoin:round}
.mosque .ghost *{fill:none!important;stroke:var(--ink3)!important;stroke-width:.8!important;stroke-dasharray:3 3;opacity:.55}

/* individual */
.indiv{margin-top:28px}
.indiv h2{font-size:1.9rem}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0 4px;font-size:.85rem;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.h{display:inline-block;width:11px;height:20px;border-radius:2px;background:var(--line)}
.h.future{background:transparent;border:1px dashed var(--line)}
.h.none{background:transparent;border:1px solid var(--ink3)}
.h.low{background:var(--bad)} .h.mid{background:var(--warn)} .h.ok{background:var(--ok)} .h.star{background:var(--gold)}
.th{font-size:1.35rem;margin:18px 0 6px;padding-inline-start:10px;border-inline-start:5px solid var(--tc)}
.srow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.srow .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.heat{display:flex;gap:2px;direction:rtl}
.avg{width:3.2em;text-align:end;font-weight:600}
.worst{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:12px 0 0;font-size:.95rem}

/* admin forms */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.panel h2{font-size:1.5rem;margin-bottom:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips button{flex:0 0 auto;min-width:44px;min-height:44px;padding:0 12px;border:1px solid var(--line);background:var(--bg);border-radius:10px}
.chips button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.chips button.cw{border-color:var(--gold);border-width:2px}

/* ---------- scoring ---------- */
function calc(){
  var S=state.settings,cw=state.currentWeek,st={};
  var tT=Math.max(1,S.tT),pg=Math.max(1,S.pages),mn=Math.max(1,S.minutes),ss=Math.max(1,S.sessions),step=Math.max(.1,S.beautyStep);
  var cap=function(x){return Math.min(x,1);},ex=function(x){return Math.min(Math.max(x-1,0),1);};
  state.students.forEach(function(s){
    st[s.id]=[];
    for(var w=1;w<=15;w++){
      var e=(state.entries[s.id]||{})[w]||{},has=Object.keys(e).length>0;
      var rt=(e.t||0)/tT,rr=(e.r||0)/pg,rl=(e.l||0)/mn,ra=(e.a||0)/ss;
      var score=100*(.3*cap(rt)+.3*cap(rr)+.3*cap(rl)+.1*cap(ra));
      var E=(ex(rt)+ex(rr)+ex(rl))/3,k;
      if(w>cw)k='future';else if(!has)k='none';else if(score>=99.99)k=E>=.1?'star':'ok';else k=score>=50?'mid':'low';
      st[s.id].push({score:score,E:E,has:has,k:k,att:(e.a||0)>=ss});
    }
  });
  var teams=[];
  for(var ti=0;ti<state.teamCount;ti++){
    var mem=state.students.filter(function(s){return s.team===ti;});
    var fills=[],cracks=[],beauty=0,flaws=0,done=0,ch={s3:0,s5:0,att:0,st3:0,back:0},run=0,prevFull=false;
    for(var w2=1;w2<=15;w2++){
      if(w2>cw||!mem.length){fills.push(0);cracks.push(0);continue;}
      var sum=0,bad=0,stars=0,att=true;
      mem.forEach(function(s){var r=st[s.id][w2-1];sum+=r.score;beauty+=r.E;if(r.score<99.99)bad++;if(w2===cw&&r.score>=99.99)done++;if(r.k==='star')stars++;if(!r.att)att=false;});
      var f=sum/mem.length/100;fills.push(f);
      if(w2<cw){cracks.push(Math.min(3,bad));flaws+=bad;}else cracks.push(0);
      var full=f>=.999;
      run=full?run+1:0;
      if(run>=3&&!ch.s3)ch.s3=w2;
      if(run>=5&&!ch.s5)ch.s5=w2;
      if(full&&w2>=2&&!prevFull&&!ch.back)ch.back=w2;
      if(att&&!ch.att)ch.att=w2;
      if(stars>=3&&!ch.st3)ch.st3=w2;
      prevFull=full;
    }
    var pct=fills.reduce(function(a,b){return a+b;},0)/15*100;
    teams.push({i:ti,name:state.teams[ti],mem:mem,fills:fills,cracks:cracks,pct:pct,flaws:flaws,done:done,ch:ch,badges:CH.filter(function(c){return ch[c.id];}).map(function(c){return c.id;}),orn:Math.min(ORN.length,Math.floor(beauty/step+1e-9))});
  }
  var sorted=teams.slice().sort(function(a,b){return b.pct-a.pct;});
  teams.forEach(function(t){t.rank=sorted.findIndex(function(x){return Math.round(x.pct)===Math.round(t.pct);})+1;});
  return {st:st,teams:teams};
}

function mosque(t,glow){
  var night=t.pct>=99.5;
  var g='<rect class="sky" width="300" height="260"/><rect class="grd" y="234" width="300" height="26"/>';
  if(night){
    g+='<circle class="moon" cx="256" cy="38" r="12"/><circle class="moonbite" cx="261" cy="35" r="10.5"/>';
    [[40,30],[80,18],[120,44],[176,22],[212,52],[20,60],[286,80],[236,20]].forEach(function(p){g+='<circle class="stardot" cx="'+p[0]+'" cy="'+p[1]+'" r="1.2"/>';});
  }
  PIECES.forEach(function(p,i){
    var f=t.fills[i],b=p.b,gl=glow&&glow[i]?' class="glow"':'';
    if(f<.999)g+='<g class="ghost">'+p.s+'</g>';
    if(f>.001){
      if(f>=.999)g+='<g'+gl+'>'+p.s+'</g>';
      else{var id='c'+t.i+'_'+i;g+='<clipPath id="'+id+'"><rect x="'+(b[0]-2)+'" y="'+(b[1]+b[3]*(1-f)).toFixed(1)+'" width="'+(b[2]+4)+'" height="'+(b[3]*f+2).toFixed(1)+'"/></clipPath><g clip-path="url(#'+id+')">'+p.s+'</g>';}
      if(f>.3)for(var k=0;k<t.cracks[i];k++){
        var cx=b[0]+b[2]*(.3+.2*k),cy=b[1]+b[3]*.12;
        g+='<path class="crack" d="M'+cx.toFixed(1)+' '+cy.toFixed(1)+'l3 '+(b[3]*.25).toFixed(1)+'l-3 '+(b[3]*.22).toFixed(1)+'l2.5 '+(b[3]*.25).toFixed(1)+'"/>';
      }
    }
  });
  ORN.slice(0,t.orn).forEach(function(o){if(t.fills[o.w-1]>=.999)g+=o.s;});
  t.badges.forEach(function(id){var o=SPEC[id];if(o&&t.fills[o.w-1]>=.999)g+=o.s;});
  return '<svg class="mosque'+(night?' night':'')+'" viewBox="0 0 300 260" role="img" aria-label="مسجد '+esc(t.name)+': اكتمل '+n2a(Math.round(t.pct))+' بالمئة" style="--tc:var(--t'+t.i+')">'+g+'</svg>';
}

function getSeen(){try{return JSON.parse(localStorage.getItem('bunyan_seen_v1')||'{}');}catch(e){return {};}}
function markSeen(keys){var o=getSeen();keys.forEach(function(k){o[k]=1;});try{localStorage.setItem('bunyan_seen_v1',JSON.stringify(o));}catch(e){}}
function cumTo(t,w){var x=0;for(var i=0;i<w;i++)x+=t.fills[i];return x/15*100;}
function highlights(C,w){
  var best=-1,names=[];
  state.students.forEach(function(s){var r=C.st[s.id][w-1];if(r.k==='star'){if(r.E>best+1e-9){best=r.E;names=[s.name];}else if(Math.abs(r.E-best)<=1e-9)names.push(s.name);}});
  var bt=0,tn=[];
  C.teams.forEach(function(t){if(!t.mem.length)return;var f=t.fills[w-1];if(f>bt+1e-9){bt=f;tn=[t];}else if(f>0&&Math.abs(f-bt)<=1e-9)tn.push(t);});
  return {names:names,teams:tn,f:bt};
}
function starWeek(C){
  var cw=state.currentWeek;
  for(var w=cw;w>=1;w--){if(highlights(C,w).names.length)return w;}
  return cw;
}
function chart(C){
  var cw=state.currentWeek,W=340,H=210,pl=10,pr=38,pt=12,pb=26,pw=W-pl-pr,ph=H-pt-pb;
  var X=function(w){return W-pr-(w/15)*pw;},Y=function(v){return pt+ph-(v/100)*ph;};
  var g='';
  [0,25,50,75,100].forEach(function(v){g+='<line class="gl" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text class="ax" x="'+(W-pr+6)+'" y="'+(Y(v)+3.5)+'">'+n2a(v)+'٪</text>';});
  [0,3,6,9,12,15].forEach(function(w){g+='<text class="ax" x="'+X(w)+'" y="'+(H-8)+'" text-anchor="middle">'+n2a(w)+'</text>';});
  g+='<path class="ideal" d="M'+X(0)+' '+Y(0)+'L'+X(15)+' '+Y(100)+'"/>';
  C.teams.forEach(function(t){
    var d='',x=0;
    for(var w=0;w<=cw;w++){if(w>0)x+=t.fills[w-1]/15*100;d+=(w?'L':'M')+X(w).toFixed(1)+' '+Y(x).toFixed(1);}
    g+='<path class="ln" style="stroke:var(--t'+t.i+')" d="'+d+'"/><circle r="4" style="fill:var(--t'+t.i+')" cx="'+X(cw).toFixed(1)+'" cy="'+Y(cumTo(t,cw)).toFixed(1)+'"/>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="تقدم الفرق أسبوعًا بأسبوع">'+g+'</svg>';
}

function summaryText(C,w){
  var cw=state.currentWeek;
  if(w>cw)return 'هذا الأسبوع لم يبدأ بعد. اختر الأسبوع الحالي أو أسبوعًا سابقًا.';
  var L=['🕌 '+state.title,'الأسبوع '+n2a(w)+' — قطعة: '+PIECES[w-1].n,'','ترتيب الفرق:'];
  var arr=C.teams.map(function(t){return {t:t,cum:cumTo(t,w),f:t.fills[w-1]};}).sort(function(a,b){return b.cum-a.cum;});
  arr.forEach(function(x,i){L.push(n2a(i+1)+'. '+x.t.name+': '+n2a(Math.round(x.cum))+'٪ من المبنى (قطعة الأسبوع '+n2a(Math.round(x.f*100))+'٪)');});
  var h=highlights(C,w);
  if(h.names.length||h.teams.length)L.push('');
  if(h.names.length)L.push('⭐ نجم الأسبوع: '+h.names.join('، '));
  if(h.teams.length)L.push('🤝 الأكثر تعاونًا: '+h.teams.map(function(t){return t.name;}).join('، '));
  var b=[];
  C.teams.forEach(function(t){CH.forEach(function(c){if(t.ch[c.id]===w)b.push('🏅 '+t.name+': '+c.n);});});
  if(b.length){L.push('');L=L.concat(b);}
  L.push('','بارك الله فيكم، ونكمل البناء الأسبوع القادم بإذن الله.');
  return L.join('\n');
}

function makePDF(imgs){

  var kids=[];for(var i=0;i<n;i++)kids.push((3+3*i)+' 0 R');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+n+' >>');
  imgs.forEach(function(im,i){
    var p=3+3*i,c='q 842 0 0 595 0 0 cm /Im0 Do Q';
    obj(p,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 842 595] /Resources << /XObject << /Im0 '+(p+2)+' 0 R >> >> /Contents '+(p+1)+' 0 R >>');
    obj(p+1,'<< /Length '+c.length+' >>\nstream\n'+c+'\nendstream');
    offs[p+2]=len;
    add((p+2)+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+im.w+' /Height '+im.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+im.bytes.length+' >>\nstream\n');
    add(im.bytes);add('\nendstream\nendobj\n');
  });
  var cnt=3*n+3,xo=len,x='xref\n0 '+cnt+'\n0000000000 65535 f \n';
  for(var k=1;k<cnt;k++)x+=('0000000000'+offs[k]).slice(-10)+' 00000 n \n';
  add(x+'trailer\n<< /Size '+cnt+' /Root 1 0 R >>\nstartxref\n'+xo+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}

function hashPw(p){
  var str='bunyan|'+p,h1=0xdeadbeef,h2=0x41c6ce57;
  for(var i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);
}

function act(a,d){

  else if(a==='tf'){ui.tf=+d.v;}

  }

    arr.forEach(function(s,i){s.team=i%state.teamCount;});touch();
  }
  else if(a==='del'){state.students=state.students.filter(function(s){return s.id!==d.id;});delete state.entries[d.id];touch();}

  else if(a==='endweek'){state.currentWeek=Math.min(15,state.currentWeek+1);ui.week=state.currentWeek;touch();}

    else{ui.confirm='reset';setTimeout(function(){if(ui.confirm==='reset'){ui.confirm='';render();}},4000);}
  }
  else if(a==='discard'){state=clone(PUB);dirty=false;msg='';ui.week=Math.min(ui.week,15);try{localStorage.removeItem(DK);}catch(e){}}
  else if(a==='dismiss'){msg='';}
  else if(a==='allpresent'||a==='copyprev'){
    var w=ui.week,list=state.students.filter(function(s){return ui.tf===-1||s.team===ui.tf;}),n=0;
    list.forEach(function(s){
      var ent=state.entries[s.id]||(state.entries[s.id]={});
      if(a==='allpresent'){(ent[w]||(ent[w]={})).a=state.settings.sessions;n++;}

    });
    touch();render();flash(a==='allpresent'?'تم تسجيل الحضور الكامل':(n?'تم النسخ لمن لا أرقام له هذا الأسبوع':'لا شيء للنسخ'));return;

  else if(a==='ghsave'){

    var oldc=ghCfg()||{};

  }
  else if(a==='ghclear'){try{localStorage.removeItem(GHK);}catch(e){}render();flash('أُزيل الربط');return;}
  else if(a==='login'){ui.login=true;}
  else if(a==='cancel'){ui.login=false;}
  else if(a==='dologin'){

  if(v===''||!isFinite(x))delete wk[f];else wk[f]=Math.max(0,x);
  if(!Object.keys(wk).length)delete ent[w];
  if(!Object.keys(ent).length)delete state.entries[id];
  touch();
  var C=calc(),r=C.st[id][w-1],badge=row.querySelector('[data-score]');
  badge.textContent=n2a(Math.round(r.score))+'٪';badge.className='score '+(w>state.currentWeek&&!r.has?'':r.k);
  if(!$bar.firstChild||msg){msg='';renderBar();}
});
document.addEventListener('change',function(e){
  var el=e.target;if(!isAdmin)return;var d=el.dataset;
  if(el.id==='impfile'){
    var f=el.files&&el.files[0];if(!f)return;
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var m=String(fr.result).match(/id="state">([\s\S]*?)<\/script>/);
        var st=JSON.parse(m[1]);
        if(!st||!Array.isArray(st.students))throw 0;
        if(state.adminHash)st.adminHash=state.adminHash;
        state=Object.assign(clone(PUB),st);ui.week=state.currentWeek;touch();render();flash('تم الاستيراد. راجع البيانات ثم انشر التعديلات.',7000);
      }catch(err){flash('الملف غير صالح');}
    };
    fr.readAsText(f);return;
  }
  if(d.sn){var s=state.students.find(function(x){return x.id===d.sn;});if(s){s.name=el.value.trim()||s.name;touch();renderBar();}}
  else if(d.st){var s2=state.students.find(function(x){return x.id===d.st;});if(s2){s2.team=+el.value;touch();render();}}
  else if(d.tn!==undefined){state.teams[+d.tn]=el.value.trim()||state.teams[+d.tn];touch();renderBar();}
  else if(d.set){var x=parseFloat(toLatin(el.value));if(isFinite(x)&&x>0)state.settings[d.set]=x;touch();render();}
  else if(d.setb){state.settings[d.setb]=el.checked;touch();render();}
  else if(d.title!==undefined){state.title=el.value.trim()||state.title;touch();document.title=state.title;renderBar();}
});

try{if(localStorage.getItem('bunyan_admin')==='1'){isAdmin=true;restoreDraft();}}catch(e){}
render();
})();
